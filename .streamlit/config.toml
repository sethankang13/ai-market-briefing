[theme]
# Streamlit 1.66 has no base="auto". Pair [theme.light] + [theme.dark]
# so the client can build Custom Theme Auto. LOOP still paints tokens
# from prefers-color-scheme so a stuck data-theme="light" cannot freeze ink.
font = "Inter"
headingFont = "Inter"
linkUnderline = false
showSidebarBorder = true
showWidgetBorder = true
baseRadius = "0.6rem"
headingFontWeights = [500, 500, 600, 600, 600, 600]

[theme.light]
primaryColor = "#263B60"
backgroundColor = "#F7F6F2"
secondaryBackgroundColor = "#E5EAF0"
textColor = "#171C25"
borderColor = "#E5EAF0"
linkColor = "#263B60"

[theme.light.sidebar]
backgroundColor = "#F7F6F2"
secondaryBackgroundColor = "#E5EAF0"
textColor = "#171C25"
borderColor = "#E5EAF0"

[theme.dark]
primaryColor = "#A7C7E7"
backgroundColor = "#171C25"
secondaryBackgroundColor = "#263B60"
textColor = "#F7F6F2"
borderColor = "#263B60"
linkColor = "#A7C7E7"

[theme.dark.sidebar]
backgroundColor = "#171C25"
secondaryBackgroundColor = "#263B60"
textColor = "#F7F6F2"
borderColor = "#263B60"
