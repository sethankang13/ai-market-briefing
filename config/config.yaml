pipeline:
  recency_cutoff_hours: 48
  top_selected_stories: 5
  max_items_per_feed: 15
  db_retention_days: 365
  output_dir: briefs
  db_path: data/loop.db

models:
  gemini:
    - gemini-3.8-flash
    - gemini-3.7-flash
    - gemini-3.6-flash
    - gemini-2.5-flash
  openai_fallback: gpt-4o-mini

tag_weights:
  "US Politics": 100
  "Market Valuations": 80
  "Labor & Economy": 70
  "Geopolitics & Trade": 60
  "Tech & Innovation": 50
  "Venture & M&A": 40

feeds:
  Politico:
    "Elections & Campaigns": "https://news.google.com/rss/search?q=site:politico.com+(elections+OR+campaign+OR+primary+OR+debate+OR+candidates)&hl=en-US&gl=US&ceid=US:en"
    "Congress & Policy": "https://news.google.com/rss/search?q=site:politico.com+(Congress+OR+Senate+OR+House+OR+bill+OR+law+OR+White+House)&hl=en-US&gl=US&ceid=US:en"
  "AP News":
    Politics: "https://news.google.com/rss/search?q=site:apnews.com+(politics+OR+election+OR+Senate+OR+House+OR+supreme+court)&hl=en-US&gl=US&ceid=US:en"
  "Washington Post":
    Politics: "https://news.google.com/rss/search?q=site:washingtonpost.com+(politics+OR+election+OR+legislation+OR+policy)&hl=en-US&gl=US&ceid=US:en"
  "CBS News":
    Politics: "https://www.cbsnews.com/latest/rss/main"
  "WSJ, Bloomberg & FT":
    Markets: "https://news.google.com/rss/search?q=(site:wsj.com+OR+site:bloomberg.com+OR+site:ft.com)+(earnings+OR+markets+OR+stocks+OR+Wall+Street)&hl=en-US&gl=US&ceid=US:en"
    Geopolitics: "https://news.google.com/rss/search?q=(site:ft.com+OR+site:wsj.com)+(geopolitics+OR+trade+OR+tariffs+OR+sanctions+OR+China)&hl=en-US&gl=US&ceid=US:en"
  Reuters:
    "Business & Markets": "https://news.google.com/rss/search?q=site:reuters.com+(business+OR+markets+OR+stocks+OR+S%26P+500)&hl=en-US&gl=US&ceid=US:en"
    "Economy & Labor": "https://news.google.com/rss/search?q=site:reuters.com+(economy+OR+Fed+OR+inflation+OR+payrolls+OR+GDP+OR+unemployment)&hl=en-US&gl=US&ceid=US:en"
    Geopolitics: "https://news.google.com/rss/search?q=site:reuters.com+(geopolitics+OR+sanctions+OR+tariffs+OR+trade+war+OR+national+security)&hl=en-US&gl=US&ceid=US:en"
    "Tech & Hardware": "https://news.google.com/rss/search?q=site:reuters.com+(technology+OR+chips+OR+semiconductors+OR+artificial+intelligence+OR+cloud)&hl=en-US&gl=US&ceid=US:en"
    "M&A & Private Equity": "https://news.google.com/rss/search?q=site:reuters.com+(buyout+OR+acquisition+OR+merger+OR+funding+OR+venture+capital)&hl=en-US&gl=US&ceid=US:en"
  CNBC:
    Markets: "https://news.google.com/rss/search?q=site:cnbc.com+(markets+OR+earnings+OR+stocks+OR+Wall+Street)&hl=en-US&gl=US&ceid=US:en"
    "Economy & Fed": "https://news.google.com/rss/search?q=site:cnbc.com+(economy+OR+Federal+Reserve+OR+inflation+OR+interest+rates+OR+jobs)&hl=en-US&gl=US&ceid=US:en"
    "Tech & Enterprise": "https://news.google.com/rss/search?q=site:cnbc.com+(technology+OR+enterprise+OR+AI+OR+software)&hl=en-US&gl=US&ceid=US:en"
  MarketWatch:
    "Top Stories": "https://feeds.marketwatch.com/marketwatch/topstories"
  "Federal Reserve":
    "Press Releases": "https://www.federalreserve.gov/feeds/press_all.xml"
  BBC:
    "World News": "https://feeds.bbci.co.uk/news/world/rss.xml"
  TechCrunch:
    General: "https://techcrunch.com/feed/"
  Axios:
    Feed: "https://www.axios.com/feeds/feed.rss"

